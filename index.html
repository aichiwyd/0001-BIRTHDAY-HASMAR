<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday!</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #7b5d4c;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .screen-container {
    position: relative;
    display: inline-block;
  }

  #screenImage {
    max-width: 100%;
    max-height: 100vh;
    display: block;
  }

  .card-overlay {
    display: none;
    position: absolute;
    top: 31.25%;
    width: 23.44%;
    height: 58.68%;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card-overlay:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }

  #lunerCard {
    left: 11.43%;
  }

  #neoCard {
    left: 65.43%;
  }

  #okButton, #rightButton {
    display: none;
    position: absolute;
    top: 63.3%;
    left: 43.3%;
    width: 13.4%;
    height: 23.8%;
    transform: rotate(45deg);
    cursor: pointer;
    z-index: 10;
    transition: box-shadow 0.2s ease;
  }

  @keyframes yellowGlow {
    0% {
      box-shadow: 0 0 0px 0px #ffd700;
    }
    50% {
      box-shadow: 0 0 25px 8px #ffd700;
    }
    100% {
      box-shadow: 0 0 0px 0px #ffd700;
    }
  }

  .glowing {
    animation: yellowGlow 0.8s ease-in-out forwards;
  }
</style>
</head>
<body onclick="handleBodyClick(event)">

<!-- Background Audio Element set to loop -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<div class="screen-container">
  <img id="screenImage" src="FACE.png" alt="Welcome User">
  <img id="lunerCard" class="card-overlay" src="LUNER.png" alt="Luner" onclick="chooseCharacter('LUNER', event)">
  <img id="neoCard" class="card-overlay" src="NEO.png" alt="Neo" onclick="chooseCharacter('Neo', event)">
  <div id="okButton" onclick="retryChoice(event)"></div>
  <div id="rightButton" onclick="proceedNext(event)"></div>
</div>

<script>
  let currentStep = "welcome";
  let isAnimating = false;

  function playAudioOnce() {
    const music = document.getElementById("bgMusic");
    if (music.paused) {
      music.play().catch(error => console.log("Audio autoplay restricted:", error));
    }
  }

  function stopAudio() {
    const music = document.getElementById("bgMusic");
    music.pause();
    music.currentTime = 0; // Reset to start
  }

  function showChoiceScreen() {
    playAudioOnce();
    document.getElementById("screenImage").src = "CHOOSE.png";
    document.getElementById("screenImage").alt = "To Begin: Please Make a Choice";
    document.body.style.backgroundColor = "#ebe8e6";
    document.body.style.cursor = "default";

    document.getElementById("okButton").style.display = "none";
    document.getElementById("okButton").classList.remove("glowing");
    document.getElementById("rightButton").style.display = "none";
    document.getElementById("rightButton").classList.remove("glowing");

    document.getElementById("lunerCard").style.display = "block";
    document.getElementById("neoCard").style.display = "block";
    currentStep = "choose";
    isAnimating = false;
  }

  function handleBodyClick(event) {
    if (isAnimating) return;

    if (currentStep === "welcome") {
      playAudioOnce();
      showChoiceScreen();
    } else if (currentStep === "end") {
      // Stop the music right before opening the SendTheSong website link
      stopAudio();
      window.open("https://sendthesong.xyz/details/6af7295022c3da5569268536", "_blank");
    }
  }

  function chooseCharacter(name, event) {
    event.stopPropagation();
    playAudioOnce();

    document.getElementById("lunerCard").style.display = "none";
    document.getElementById("neoCard").style.display = "none";

    if (name === "Neo") {
      document.getElementById("screenImage").src = "WRONG.png";
      document.getElementById("screenImage").alt = "Wrong Choice";
      document.body.style.backgroundColor = "#7b5d4c";
      document.getElementById("okButton").style.display = "block";
      currentStep = "wrong";
    } else if (name === "LUNER") {
      document.getElementById("screenImage").src = "RIGHT.png";
      document.getElementById("screenImage").alt = "Right Choice";
      document.body.style.backgroundColor = "#7b5d4c";
      document.getElementById("rightButton").style.display = "block";
      currentStep = "right";
    }
  }

  function retryChoice(event) {
    event.stopPropagation();
    if (isAnimating) return;
    isAnimating = true;

    const okBtn = document.getElementById("okButton");
    okBtn.classList.add("glowing");

    setTimeout(() => {
      document.body.style.backgroundColor = "#000000";
      document.getElementById("screenImage").style.display = "none";
      okBtn.style.display = "none";
    }, 800);

    setTimeout(() => {
      document.getElementById("screenImage").style.display = "block";
      showChoiceScreen();
    }, 1200);
  }

  function proceedNext(event) {
    event.stopPropagation();
    if (isAnimating) return;
    isAnimating = true;

    const rightBtn = document.getElementById("rightButton");
    rightBtn.classList.add("glowing");

    setTimeout(() => {
      document.body.style.backgroundColor = "#000000";
      document.getElementById("screenImage").style.display = "none";
      rightBtn.style.display = "none";
    }, 800);

    setTimeout(() => {
      document.body.style.backgroundColor = "#ffffff";
      document.getElementById("screenImage").src = "END.png";
      document.getElementById("screenImage").alt = "Birthday Note";
      document.getElementById("screenImage").style.display = "block";
      document.body.style.cursor = "pointer";
      currentStep = "end";
      isAnimating = false;
    }, 1200);
  }
</script>

</body>
</html>
